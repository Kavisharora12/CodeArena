<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeArena — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15181f;
    --panel: #1d212b;
    --panel-raised: #242938;
    --border: #2e3444;
    --text: #e7e9ee;
    --text-dim: #8890a3;
    --amber: #e8a33d;
    --amber-dim: #7a5a26;
    --green: #5fb87a;
    --red: #e0656a;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
    --display: 'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
  .wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px;}

  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:28px;border-bottom:1px solid var(--border);padding-bottom:20px;
    flex-wrap:wrap;gap:16px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{font-family:var(--mono);color:var(--amber);font-size:13px;border:1px solid var(--amber-dim);padding:2px 6px;border-radius:4px;}
  h1{font-family:var(--display);font-size:24px;margin:0;letter-spacing:-0.01em;}
  .sub{color:var(--text-dim);font-size:13px;margin-top:4px;font-family:var(--mono);}

  .who{display:flex;align-items:center;gap:12px;}
  .who .name{font-size:13px;color:var(--text-dim);}
  .who .role-badge{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--amber-dim);color:var(--amber);text-transform:uppercase;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;margin-bottom:18px;}
  .panel h2{font-family:var(--display);font-size:16px;margin:0 0 14px;}

  label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em;}
  input[type=text], input[type=email], input[type=password], textarea, select{
    width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;
    color:var(--text);padding:10px 12px;font-family:var(--sans);font-size:14px;resize:vertical;
  }
  textarea.code{font-family:var(--mono);font-size:13px;min-height:160px;line-height:1.5;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--amber);outline-offset:1px;}

  .tc-row{display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;align-items:center;margin-bottom:8px;}
  .tc-row input{font-family:var(--mono);font-size:13px;}
  .hidden-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);white-space:nowrap;}
  .icon-btn{background:none;border:1px solid var(--border);color:var(--text-dim);width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:16px;line-height:1;}
  .icon-btn:hover{border-color:var(--red);color:var(--red);}

  .btn{font-family:var(--sans);font-weight:600;font-size:13px;border:none;border-radius:7px;padding:10px 18px;cursor:pointer;transition:opacity .15s;}
  .btn:hover{opacity:.88;}
  .btn-primary{background:var(--amber);color:#1a1508;}
  .btn-ghost{background:var(--panel-raised);color:var(--text);border:1px solid var(--border);}
  .btn-sm{padding:6px 12px;font-size:12px;}

  .qcard{background:var(--panel-raised);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:border-color .15s;}
  .qcard:hover{border-color:var(--amber-dim);}
  .qcard.selected{border-color:var(--amber);}
  .qcard .name{font-weight:600;font-size:14px;}
  .qcard .meta{color:var(--text-dim);font-size:12px;font-family:var(--mono);margin-top:3px;}

  .empty{color:var(--text-dim);font-size:13px;font-style:italic;padding:20px 0;text-align:center;}
  .pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--text-dim);}
  .pill.public{border-color:var(--green);color:var(--green);}

  .desc{color:var(--text-dim);font-size:14px;line-height:1.6;margin-bottom:16px;}
  .tc-example{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;margin-bottom:8px;color:var(--text-dim);}
  .tc-example b{color:var(--text);}

  .verdict{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:8px;margin-bottom:14px;font-family:var(--mono);font-weight:600;font-size:14px;}
  .verdict.pass{background:rgba(95,184,122,.12);border:1px solid var(--green);color:var(--green);}
  .verdict.fail{background:rgba(224,101,106,.12);border:1px solid var(--red);color:var(--red);}

  .result-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:6px;background:var(--panel-raised);margin-bottom:6px;font-family:var(--mono);font-size:12.5px;}
  .result-row .status{font-weight:700;}
  .result-row .status.ok{color:var(--green);}
  .result-row .status.no{color:var(--red);}

  .signature-hint{background:var(--bg);border:1px dashed var(--border);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;color:var(--amber);margin-bottom:10px;}

  .auth-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .auth-toggle button{flex:1;background:var(--panel-raised);border:1px solid var(--border);color:var(--text-dim);padding:9px;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;}
  .auth-toggle button.active{background:var(--amber);color:#1a1508;border-color:var(--amber);}

  .error-box{background:rgba(224,101,106,.12);border:1px solid var(--red);color:var(--red);padding:10px 12px;border-radius:6px;font-size:13px;margin-top:12px;}
  .server-note{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);margin-top:10px;}
  .server-note.bad{color:var(--red);}
  .server-note.good{color:var(--green);}

  .role-pick{display:flex;gap:10px;margin-top:6px;}
  .role-pick label{display:flex;align-items:center;gap:6px;text-transform:none;font-size:13px;color:var(--text);font-weight:400;margin:0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand"><span class="mark">CA</span><h1>CodeArena</h1></div>
      <div class="sub">prototype — connected to backend</div>
    </div>
    <div id="header-right"></div>
  </header>

  <div id="app"></div>
</div>

<script>
// Point this at wherever your backend is running.
const API_BASE = 'http://localhost:4000/api';

let token = null;
let user = null;         // { id, name, role }
let apiStatus = null;    // 'ok' | 'down' | null

let questions = [];
let selectedQId = null;
let draftTestCases = [{input:'', output:'', hidden:false}];
let lastResult = null;
let studentCode = {};
let authMode = 'login';  // 'login' | 'register'
let authError = '';

async function api(path, opts = {}){
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if(token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  let data = null;
  try { data = await res.json(); } catch(e) { /* e.g. 204 No Content */ }
  if(!res.ok){
    const message = (data && data.error) || `Request failed (${res.status})`;
    throw new Error(message);
  }
  return data;
}

async function checkApi(){
  try{
    await fetch(API_BASE + '/health');
    apiStatus = 'ok';
  }catch(e){
    apiStatus = 'down';
  }
}

// ---------- Auth ----------

async function handleAuthSubmit(e){
  e.preventDefault();
  authError = '';
  const name = document.getElementById('a-name') ? document.getElementById('a-name').value.trim() : '';
  const email = document.getElementById('a-email').value.trim();
  const password = document.getElementById('a-password').value;
  const role = document.querySelector('input[name="a-role"]:checked') ? document.querySelector('input[name="a-role"]:checked').value : 'student';

  try{
    let data;
    if(authMode === 'register'){
      data = await api('/auth/register', { method: 'POST', body: JSON.stringify({ name, email, password, role }) });
    } else {
      data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
    }
    token = data.token;
    user = data.user;
    await loadQuestions();
    render();
  }catch(err){
    authError = err.message;
    render();
  }
}

function logout(){
  token = null;
  user = null;
  questions = [];
  selectedQId = null;
  lastResult = null;
  render();
}

// ---------- Data loading ----------

async function loadQuestions(){
  try{
    const data = await api('/questions');
    questions = data.questions;
  }catch(err){
    questions = [];
    authError = 'Could not load questions: ' + err.message;
  }
}

// ---------- Faculty actions ----------

function addDraftRow(){ draftTestCases.push({input:'', output:'', hidden:false}); render(); }
function removeDraftRow(i){
  draftTestCases.splice(i,1);
  if(draftTestCases.length===0) draftTestCases.push({input:'', output:'', hidden:false});
  render();
}
function updateDraftRow(i, field, val){ draftTestCases[i][field] = val; }

async function createQuestion(){
  const title = document.getElementById('f-title').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  if(!title){ alert('Give the question a title.'); return; }
  const cases = draftTestCases.filter(c => c.input.trim() && c.output.trim());
  if(cases.length===0){ alert('Add at least one test case (input + expected output).'); return; }
  for(const c of cases){
    try{ JSON.parse(c.input); JSON.parse(c.output); }
    catch(e){ alert('Test case input/output must be valid JSON, e.g. [1,2,3] or 42 or "hello".'); return; }
  }
  try{
    await api('/questions', { method: 'POST', body: JSON.stringify({ title, description: desc, testCases: cases }) });
    await loadQuestions();
    document.getElementById('f-title').value = '';
    document.getElementById('f-desc').value = '';
    draftTestCases = [{input:'', output:'', hidden:false}];
    render();
  }catch(err){
    alert('Could not create question: ' + err.message);
  }
}

async function deleteQuestion(id){
  try{
    await api('/questions/' + id, { method: 'DELETE' });
    if(selectedQId === id) selectedQId = null;
    await loadQuestions();
    render();
  }catch(err){
    alert('Could not delete question: ' + err.message);
  }
}

// ---------- Student actions ----------

async function selectQuestion(id){
  selectedQId = id;
  lastResult = null;
  render();
}

async function runSubmission(){
  const listQ = questions.find(q => q.id === selectedQId);
  if(!listQ) return;

  let full;
  try{
    const data = await api('/questions/' + selectedQId + '/for-submission');
    full = data.question; // includes hidden test cases, fetched only now, at submit time
  }catch(err){
    alert('Could not fetch test cases: ' + err.message);
    return;
  }

  const code = studentCode[selectedQId] || '';
  const results = [];
  let passCount = 0;

  for(const tc of full.testCases){
    let input, expected;
    try{ input = JSON.parse(tc.input); expected = JSON.parse(tc.output); }
    catch(e){ results.push({ hidden: tc.hidden, ok:false, error:'Malformed test case data' }); continue; }

    try{
      const fn = new Function('input', code + '\nreturn solve(input);');
      const actual = fn(input);
      const ok = JSON.stringify(actual) === JSON.stringify(expected);
      if(ok) passCount++;
      results.push({ hidden: tc.hidden, ok, actual, expected, input: tc.input });
    }catch(e){
      results.push({ hidden: tc.hidden, ok:false, error: e.message, input: tc.input });
    }
  }

  lastResult = {
    total: full.testCases.length,
    passed: passCount,
    accepted: passCount === full.testCases.length,
    results
  };
  render();

  try{
    await api('/submissions', {
      method: 'POST',
      body: JSON.stringify({
        questionId: selectedQId,
        code,
        passed: passCount,
        total: full.testCases.length,
        accepted: lastResult.accepted,
        results: results.map(r => ({ hidden: r.hidden, ok: r.ok, error: r.error || null }))
      })
    });
  }catch(err){
    console.error('Submission recorded locally but failed to save to server:', err.message);
  }
}

// ---------- Render ----------

function render(){
  renderHeader();
  const app = document.getElementById('app');
  if(!token){
    app.innerHTML = renderAuth();
  } else if(user.role === 'faculty'){
    app.innerHTML = renderFaculty();
  } else {
    app.innerHTML = renderStudent();
  }
  attachHandlers();
}

function renderHeader(){
  const el = document.getElementById('header-right');
  if(!token){
    el.innerHTML = apiStatus === 'down'
      ? `<span class="server-note bad">● backend not reachable at ${API_BASE}</span>`
      : '';
    return;
  }
  el.innerHTML = `
    <div class="who">
      <span class="name">${escapeHtml(user.name)}</span>
      <span class="role-badge">${escapeHtml(user.role)}</span>
      <button class="btn btn-ghost btn-sm" id="btn-logout">Log out</button>
    </div>
  `;
}

function renderAuth(){
  return `
    <div class="panel" style="max-width:420px;margin:40px auto 0;">
      <h2>${authMode === 'login' ? 'Log in' : 'Create an account'}</h2>
      <div class="auth-toggle">
        <button type="button" data-role="auth-login" class="${authMode==='login'?'active':''}">Log in</button>
        <button type="button" data-role="auth-register" class="${authMode==='register'?'active':''}">Register</button>
      </div>
      <form id="auth-form">
        ${authMode === 'register' ? `
          <label>Name</label>
          <input type="text" id="a-name" required>
          <label>Role</label>
          <div class="role-pick">
            <label><input type="radio" name="a-role" value="student" checked> Student</label>
            <label><input type="radio" name="a-role" value="faculty"> Faculty</label>
          </div>
        ` : ''}
        <label>Email</label>
        <input type="email" id="a-email" required>
        <label>Password</label>
        <input type="password" id="a-password" required>
        <div style="margin-top:18px;">
          <button class="btn btn-primary" type="submit">${authMode === 'login' ? 'Log in' : 'Create account'}</button>
        </div>
        ${authError ? `<div class="error-box">${escapeHtml(authError)}</div>` : ''}
        ${apiStatus === 'down' ? `<div class="server-note bad">Backend not reachable at ${API_BASE} — make sure it's running (npm start in codearena-backend).</div>` : ''}
      </form>
    </div>
  `;
}

function renderFaculty(){
  return `
    <div class="panel">
      <h2>New question</h2>
      <label>Title</label>
      <input type="text" id="f-title" placeholder="e.g. Two Sum">
      <label>Description</label>
      <textarea id="f-desc" rows="3" placeholder="Given an array of integers and a target, return the indices of the two numbers that add up to the target."></textarea>

      <label>Test cases <span style="text-transform:none;color:var(--text-dim);font-weight:400;">(input and expected output as JSON — e.g. [2,7,11,15] and [0,1])</span></label>
      <div id="tc-rows">
        ${draftTestCases.map((c,i) => `
          <div class="tc-row">
            <input type="text" data-role="tc-input" data-i="${i}" placeholder="input, e.g. [2,7,11,15]" value="${escapeAttr(c.input)}">
            <input type="text" data-role="tc-output" data-i="${i}" placeholder="expected output, e.g. [0,1]" value="${escapeAttr(c.output)}">
            <label class="hidden-toggle"><input type="checkbox" data-role="tc-hidden" data-i="${i}" ${c.hidden?'checked':''}> Hidden</label>
            <button class="icon-btn" data-role="tc-remove" data-i="${i}" title="Remove">✕</button>
          </div>
        `).join('')}
      </div>
      <div style="margin-top:8px;display:flex;gap:10px;">
        <button class="btn btn-ghost btn-sm" id="btn-add-row">+ Add test case</button>
      </div>
      <div style="margin-top:18px;">
        <button class="btn btn-primary" id="btn-create-q">Create question</button>
      </div>
    </div>

    <div class="panel">
      <h2>Existing questions (${questions.length})</h2>
      ${questions.length===0 ? '<div class="empty">No questions yet — create one above.</div>' :
        questions.map(q => `
          <div class="qcard">
            <div>
              <div class="name">${escapeHtml(q.title)}</div>
              <div class="meta">${q.testCases.length} test case${q.testCases.length===1?'':'s'} · ${q.testCases.filter(c=>c.hidden).length} hidden</div>
            </div>
            <button class="icon-btn" data-role="delete-q" data-id="${q.id}" title="Delete">✕</button>
          </div>
        `).join('')
      }
    </div>
  `;
}

function renderStudent(){
  const q = questions.find(q => q.id === selectedQId);
  let listHtml = `
    <div class="panel">
      <h2>Practice questions</h2>
      ${questions.length===0 ? '<div class="empty">No questions available — ask faculty to add one.</div>' :
        questions.map(qq => `
          <div class="qcard ${qq.id===selectedQId?'selected':''}" data-role="select-q" data-id="${qq.id}">
            <div>
              <div class="name">${escapeHtml(qq.title)}</div>
              <div class="meta">${qq.testCases.length} public test case${qq.testCases.length===1?'':'s'} shown</div>
            </div>
          </div>
        `).join('')
      }
    </div>
  `;

  if(!q) return listHtml;

  let resultHtml = '';
  if(lastResult){
    resultHtml = `
      <div class="verdict ${lastResult.accepted?'pass':'fail'}">
        ${lastResult.accepted ? '✓ Accepted' : '✕ Not accepted'} — ${lastResult.passed}/${lastResult.total} test cases passed
      </div>
      ${lastResult.results.map((r,i) => `
        <div class="result-row">
          <span>Test ${i+1} ${r.hidden?'(hidden)':'(public)'}</span>
          <span class="status ${r.ok?'ok':'no'}">${r.ok ? 'PASS' : (r.error ? 'ERROR: '+escapeHtml(r.error) : 'FAIL — got '+escapeHtml(JSON.stringify(r.actual)))}</span>
        </div>
      `).join('')}
      <div class="server-note good">Saved to your submission history on the server.</div>
    `;
  }

  return listHtml + `
    <div class="panel">
      <h2>${escapeHtml(q.title)}</h2>
      <div class="desc">${escapeHtml(q.description) || '<em>No description provided.</em>'}</div>

      ${q.testCases.map(c => `
        <div class="tc-example"><span class="pill public">sample</span> &nbsp; <b>input:</b> ${escapeHtml(c.input)} &nbsp; <b>expected:</b> ${escapeHtml(c.output)}</div>
      `).join('')}

      <label>Your solution</label>
      <div class="signature-hint">Define a function called <b>solve(input)</b> — it receives the test input and must return the output.</div>
      <textarea class="code" id="s-code" placeholder="function solve(input) {\n  // your code here\n}">${escapeHtml(studentCode[q.id] || '')}</textarea>

      <div style="margin-top:16px;">
        <button class="btn btn-primary" id="btn-submit">Submit</button>
      </div>

      <div style="margin-top:18px;">
        ${resultHtml}
      </div>
    </div>
  `;
}

function attachHandlers(){
  const authForm = document.getElementById('auth-form');
  if(authForm) authForm.onsubmit = handleAuthSubmit;
  const loginTab = document.querySelector('[data-role="auth-login"]');
  if(loginTab) loginTab.onclick = () => { authMode = 'login'; authError=''; render(); };
  const registerTab = document.querySelector('[data-role="auth-register"]');
  if(registerTab) registerTab.onclick = () => { authMode = 'register'; authError=''; render(); };

  const logoutBtn = document.getElementById('btn-logout');
  if(logoutBtn) logoutBtn.onclick = logout;

  const addRow = document.getElementById('btn-add-row');
  if(addRow) addRow.onclick = addDraftRow;
  const createQ = document.getElementById('btn-create-q');
  if(createQ) createQ.onclick = createQuestion;

  document.querySelectorAll('[data-role="tc-input"]').forEach(el => { el.oninput = () => updateDraftRow(+el.dataset.i, 'input', el.value); });
  document.querySelectorAll('[data-role="tc-output"]').forEach(el => { el.oninput = () => updateDraftRow(+el.dataset.i, 'output', el.value); });
  document.querySelectorAll('[data-role="tc-hidden"]').forEach(el => { el.onchange = () => updateDraftRow(+el.dataset.i, 'hidden', el.checked); });
  document.querySelectorAll('[data-role="tc-remove"]').forEach(el => { el.onclick = () => removeDraftRow(+el.dataset.i); });
  document.querySelectorAll('[data-role="delete-q"]').forEach(el => { el.onclick = () => deleteQuestion(el.dataset.id); });
  document.querySelectorAll('[data-role="select-q"]').forEach(el => { el.onclick = () => selectQuestion(el.dataset.id); });

  const submitBtn = document.getElementById('btn-submit');
  if(submitBtn) submitBtn.onclick = runSubmission;
  const codeArea = document.getElementById('s-code');
  if(codeArea) codeArea.oninput = () => { studentCode[selectedQId] = codeArea.value; };
}

function escapeHtml(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

(async function init(){
  await checkApi();
  render();
})();
</script>
</body>
</html>
